[workspace]
resolver = "2"

[package]
name = "frame-analyzer-ebpf"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"

[[bin]]
name = "frame-analyzer-ebpf"
path = "src/main.rs"

[dependencies]
aya-ebpf = "0.1.0"
frame-analyzer-ebpf-common = "0"

[profile.dev]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
debug-assertions = false
panic = "abort"
overflow-checks = false
incremental = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
